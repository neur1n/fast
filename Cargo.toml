[package]
name = "fast"
version = "0.0.10"
edition = "2024"
description = "A small terminal directory navigator"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "osc52"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
unicode-width = "0.2"
